[package]
name = "marketplace"
version = "0.1.0"
edition = "2021"
publish = false
description = "SwarmCompute marketplace: commit-reveal reverse auction + escrow on NEAR Testnet"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Verified against crates.io on 2026-11-07 (latest stable: 5.30.1).
near-sdk = "5.30.1"

[dev-dependencies]
near-sdk = { version = "5.30.1", features = ["unit-testing"] }
# Testnet integration tests live in contracts/marketplace-testnet-tests (separate
# crate, so unit tests don't pull in near-workspaces' native crypto deps).

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
